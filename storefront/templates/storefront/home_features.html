{% if features %}
<!-- ============ TRUST BADGES (Admin > Storefront > Home page features) ============ -->
<section class="mz-usp">
  <div class="container-xl">
    <div class="trust-row">
      <div class="row g-3">
        {% for f in features %}
        <div class="col col-md-{% if features|length >= 4 %}3{% elif features|length == 3 %}4{% else %}6{% endif %}">
          {% if f.link %}<a href="{{ f.link }}" class="text-reset text-decoration-none">{% endif %}
          <div class="trust-item"><div class="trust-icon"><i class="bi {{ f.icon }}"></i></div><div><h6>{{ f.title }}</h6>{% if f.subtitle %}<small>{{ f.subtitle }}</small>{% endif %}</div></div>
          {% if f.link %}</a>{% endif %}
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
{% endif %}
