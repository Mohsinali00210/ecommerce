<!DOCTYPE html>
<html><body style="margin:0;padding:24px;background:#f4f5fa;font-family:Arial,Helvetica,sans-serif;color:#1d2233">
<table role="presentation" width="100%" style="max-width:480px;margin:auto;background:#fff;border-radius:14px">
<tr><td style="padding:28px 24px">
  <div style="font-weight:bold;letter-spacing:.06em;color:#5b4cf0">SHAN ZEE · ADMIN</div>
  <h2 style="margin:14px 0 8px;font-size:20px">Your verification code</h2>
  <p style="color:#3b4260;line-height:1.6;margin:0 0 18px">Someone signed in as {{ user.email }} wants to <strong>{{ action }}</strong>.</p>
  <div style="font-size:34px;letter-spacing:10px;font-weight:bold;text-align:center;background:#f4f3ff;border-radius:12px;padding:16px 0;color:#0f1424">{{ code }}</div>
  <p style="color:#6b7290;font-size:13px;line-height:1.6;margin:18px 0 0">The code works for {{ minutes }} minutes. Request IP: {{ ip }}.<br>
  <strong>If this wasn't you, change your password now</strong> - someone may have access to your admin account.</p>
</td></tr></table>
</body></html>
