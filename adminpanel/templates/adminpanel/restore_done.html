{% load static %}<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restore complete</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5fa;font-family:Inter,system-ui,sans-serif;color:#0f1424}
.box{max-width:480px;background:#fff;border-radius:18px;padding:36px 30px;text-align:center;box-shadow:0 20px 60px rgba(16,24,40,.1)}
p{color:#6b7290;line-height:1.6} a{display:inline-block;background:#5b4cf0;color:#fff;padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600}</style></head>
<body><main class="box"><h1>Restore complete</h1>
<p>{{ result.records }} records and {{ result.files }} files were restored. A safety copy of the previous data was saved as <code>{{ result.safety }}</code>.</p>
<p>Everyone has been signed out. Sign in again to continue.</p><a href="{% url 'login' %}">Sign in</a></main></body></html>
