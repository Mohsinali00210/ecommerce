{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title }} · Shan Zee</title>
<style>
  :root { --a:#5b4cf0; --ink:#0f1424; --muted:#6b7290; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink);
         background: radial-gradient(1200px 600px at 10% -10%, #ece9ff 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #fff1d9 0%, transparent 55%), #f6f7fb; }
  .box { max-width:520px; width:100%; background:#fff; border-radius:20px; padding:40px 36px; text-align:center;
         box-shadow: 0 20px 60px rgba(16,24,40,.12); animation: in .4s cubic-bezier(.2,.8,.2,1); }
  @keyframes in { from { opacity:0; transform: translateY(10px); } }
  .code { font-size:72px; font-weight:800; letter-spacing:-.04em; line-height:1;
          background: linear-gradient(135deg, var(--a), #9a8cff 60%, #c8a24a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font-size:22px; margin:14px 0 8px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
  .ref { font-size:12px; color:var(--muted); margin-top:18px; }
  .ref code { background:#f1f2f8; padding:2px 8px; border-radius:6px; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  a.btn { display:inline-block; padding:11px 20px; border-radius:10px; font-weight:600; text-decoration:none; font-size:14px; }
  a.primary { background:var(--a); color:#fff; box-shadow:0 6px 16px rgba(91,76,240,.3); }
  a.ghost { background:#f1f2f8; color:var(--ink); }
  a:focus-visible { outline:2px solid var(--a); outline-offset:2px; }
</style>
</head>
<body>
  <main class="box" role="main">
    <div class="code" aria-hidden="true">{{ status }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="btns">
      <a class="btn ghost" href="javascript:history.back()">Go back</a>
      {% if is_admin %}<a class="btn primary" href="/Adminpanel/">Admin dashboard</a>{% else %}<a class="btn primary" href="/">Go to the shop</a>{% endif %}
    </div>
    {% if reference %}<div class="ref">Reference: <code>{{ reference }}</code> - share this with support if the problem continues.</div>{% endif %}
  </main>
</body>
</html>
