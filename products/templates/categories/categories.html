{% extends "base.html" %}

{% block title %}Categories{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <i class="bi bi-folder"></i> Categories List
        </div>
        <div>
            <button class="btn btn-dark btn-sm" onclick="openAddCategoryModal();">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>
    </div>

    <div class="card-body p-0">
        <table class="table table-sm table-bordered align-middle mb-4">
            <thead class="table-light">
                <tr>
                    <th>Category Name</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th style="width:160px;">Actions</th>
                </tr>
            </thead>
            <tbody id="categoryBody"></tbody>
        </table>
    </div>
</div>

<!-- ===================== Sub-category (hierarchy) modal ===================== -->
<div class="modal fade" id="subCategoryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <input type="hidden" id="currentParentId">

            <div class="modal-header bg-dark text-white">
                <h6 class="modal-title">
                    <i class="bi bi-layers"></i> Category Hierarchy Manager
                </h6>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-3 p-2 bg-light rounded" id="categoryBreadcrumbs"></ol>
                </nav>

                <div class="card mb-4 shadow-sm">
                    <div class="card-body p-3">
                        <label class="form-label small fw-bold text-uppercase text-muted">
                            Add New Item under: <span id="activeParentLabel" class="text-primary">Root</span>
                        </label>
                        <div class="input-group">
                            <input type="text" id="newSubCatName" class="form-control form-control-sm" placeholder="Enter sub-category name...">
                            <button class="btn btn-primary btn-sm" onclick="saveSubCategory()">
                                <i class="bi bi-plus-circle"></i> Add
                            </button>
                        </div>
                    </div>
                </div>

                <div class="table-responsive" style="max-height: 400px;">
                    <table class="table table-sm table-hover border">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th>Name</th>
                                <th class="text-center">Nested Items</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="subCategoryTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="modal-footer bg-light">
                <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Finish &amp; Close</button>
            </div>
        </div>
    </div>
</div>

<!-- ===================== Add / Edit category modal ===================== -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">
                    <i class="bi bi-plus-circle"></i> <span id="categoryModalTitle">Category</span>
                </h6>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <input type="hidden" id="CategoryId">

                <label class="form-label">Category Name</label>
                <input type="text" class="form-control form-control-sm" id="CategoryName">

                <label class="form-label mt-2">Category Image</label>
                <input type="file" id="CategoryImage" class="form-control form-control-sm" accept="image/*">
                <img id="PreviewCategoryImage" src="" alt="" class="mt-2 d-none" style="max-width:100px">

                <label class="form-label mt-2">Status</label>
                <select class="form-select form-select-sm" id="is_active">
                    <option value="">Select Status</option>
                    <option value="1">Active</option>
                    <option value="0">Inactive</option>
                </select>
            </div>

            <div class="modal-footer">
                <button class="btn btn-dark btn-sm w-100" onclick="saveCategory()">Save Category</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- Sidebar ----------
    $(".sidebar a").removeClass('active');
    $("#CategoryLink").addClass('active');

    // ---------- Config / state ----------
    const API_BASE_URL = `${window.location.origin}/Adminpanel/Products/api/v1/categories/`;
    const categoryCache = {};   // id -> category object (filled every time a list loads)
    let navigationStack = [];   // breadcrumb path: [{id, name}, ...]

    function authHeaders() {
        return { "Authorization": `Bearer ${localStorage.getItem("access_token")}` };
    }

    // Prevents names like  Men's Wear  or  <b>  from breaking the HTML
    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Wraps fetch so every call returns {ok, status, data}
    async function apiRequest(url, method = "GET", body = null) {
        const options = { method, headers: authHeaders() };
        if (body) options.body = body;            // FormData -> browser sets Content-Type itself
        const res = await fetch(url, options);
        let data = null;
        try { data = await res.json(); } catch (e) { /* 204 No Content etc. */ }
        return { ok: res.ok, status: res.status, data };
    }

    function showApiError(result) {
        if (result.status === 400) {
            const d = result.data || {};
            const firstKey = Object.keys(d)[0];
            const msg = firstKey ? `${firstKey}: ${[].concat(d[firstKey])[0]}` : "Validation failed.";
            showAlert(msg, "warning");
        } else if (result.status === 401) {
            showAlert("Session expired. Please login again.", "danger");
        } else {
            showAlert("Server error. Logged in database.", "danger");
        }
    }

    // ---------- Load lists ----------
    async function getCategories(el = "categoryBody", parentId = null) {
        let url = API_BASE_URL + (parentId !== null ? `?parent=${parentId}` : `?parent=null`);

        try {
            const result = await apiRequest(url);
            if (!result.ok) { showApiError(result); return; }

            // Works with plain lists and with DRF pagination ({results: [...]})
            const list = Array.isArray(result.data) ? result.data : (result.data?.results || []);
            const isSubModal = (el === "subCategoryTableBody");
            let html = "";

            list.forEach(item => {
                categoryCache[item.id] = item;
                const name = escapeHtml(item.name);

                if (!isSubModal) {
                    html += `
                    <tr>
                        <td>${name}</td>
                        <td><span class="badge ${item.is_active ? 'bg-success' : 'bg-secondary'}">${item.is_active ? 'Active' : 'Inactive'}</span></td>
                        <td>${item.created_at ? new Date(item.created_at).toLocaleDateString() : ''}</td>
                        <td>
                            <div class="btn-group">
                                <button class="btn btn-outline-secondary btn-sm" data-action="edit" data-id="${item.id}" title="Edit">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-outline-primary btn-sm" data-action="explore-root" data-id="${item.id}" title="Sub-categories">
                                    <i class="bi bi-diagram-3"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
                } else {
                    html += `
                    <tr>
                        <td class="fw-bold">${name}</td>
                        <td class="text-center">
                            <span class="badge rounded-pill bg-secondary">${item.children_count || 0}</span>
                        </td>
                        <td class="text-end">
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-primary" data-action="explore" data-id="${item.id}">
                                    <i class="bi bi-arrow-right-short"></i> Explore
                                </button>
                                <button class="btn btn-outline-danger" data-action="delete" data-id="${item.id}">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>`;
                }
            });

            if (list.length === 0) {
                html = `<tr><td colspan="4" class="text-center text-muted">No items found here.</td></tr>`;
            }
            $(`#${el}`).html(html);
        } catch (err) {
            showAlert("Failed to load data", "danger");
            console.error(err);
        }
    }

    // ---------- One click handler for all row / breadcrumb buttons ----------
    $(document).on('click', '[data-action]', function (e) {
        e.preventDefault();
        const action = $(this).data('action');
        const id = Number($(this).data('id'));
        const item = categoryCache[id];

        switch (action) {
            case 'edit':
                fillCategoryModal(item);
                $('#addCategoryModal').modal('show');
                break;
            case 'explore-root':           // from main table: start a fresh path
                navigationStack = [];
                openSubModal(item.id, item.name);
                break;
            case 'explore':                // inside the modal: go one level deeper
                openSubModal(item.id, item.name);
                break;
            case 'crumb': {
                const crumb = navigationStack.find(c => c.id === id);
                if (crumb) openSubModal(crumb.id, crumb.name);
                break;
            }
            case 'delete':
                deleteCategory(id);
                break;
        }
    });

    // ---------- Add / edit top-level category ----------
    function clearCategoryModal() {
        $('#CategoryId').val('');
        $('#CategoryName').val('');
        $('#is_active').val('');
        $('#CategoryImage').val('');
        $('#PreviewCategoryImage').attr('src', '').addClass('d-none');
    }

    function openAddCategoryModal() {
        clearCategoryModal();
        $('#categoryModalTitle').text('Add Category');
        $('#addCategoryModal').modal('show');
    }

    function fillCategoryModal(item) {
        clearCategoryModal();
        if (!item) return;
        $('#categoryModalTitle').text('Edit Category');
        $('#CategoryId').val(item.id);
        $('#CategoryName').val(item.name);
        $('#is_active').val(item.is_active ? '1' : '0');
        if (item.image) {
            $('#PreviewCategoryImage').attr('src', item.image).removeClass('d-none');
        }
    }

    // Live preview when a new image is picked
    $('#CategoryImage').on('change', function () {
        const file = this.files[0];
        if (file) $('#PreviewCategoryImage').attr('src', URL.createObjectURL(file)).removeClass('d-none');
    });

    async function saveCategory() {
        const id = $('#CategoryId').val();
        const name = $('#CategoryName').val().trim();
        const isActive = $('#is_active').val();
        const image = $('#CategoryImage')[0].files[0];

        if (!name) { showAlert("Category name is required.", "warning"); return; }

        const formData = new FormData();
        formData.append("name", name);
        if (isActive !== '') formData.append("is_active", isActive);
        if (image) formData.append("image", image);

        const url = id === '' ? API_BASE_URL : `${API_BASE_URL}${id}/`;
        const method = id === '' ? "POST" : "PATCH";

        try {
            const result = await apiRequest(url, method, formData);
            if (!result.ok) { showApiError(result); return; }

            showAlert(id === '' ? "Category Created!" : "Category Updated!", "success");
            $('#addCategoryModal').modal('hide');
            getCategories();
        } catch (err) {
            showAlert("Connection failed!", "danger");
            console.error(err);
        }
    }

    // ---------- Sub-category modal ----------
    function openSubModal(parentId, parentName) {
        $('#currentParentId').val(parentId);
        $('#activeParentLabel').text(parentName);
        $('#newSubCatName').val('');
        updateBreadcrumbs(parentId, parentName);
        getCategories("subCategoryTableBody", parentId);
        $('#subCategoryModal').modal('show');
    }

    function updateBreadcrumbs(id, name) {
        const index = navigationStack.findIndex(x => x.id === id);
        if (index === -1) navigationStack.push({ id, name });
        else navigationStack = navigationStack.slice(0, index + 1);

        let html = '<li class="breadcrumb-item"><a href="#" onclick="resetToRoot(); return false;">Root</a></li>';
        navigationStack.forEach((crumb, i) => {
            const safeName = escapeHtml(crumb.name);
            html += (i === navigationStack.length - 1)
                ? `<li class="breadcrumb-item active">${safeName}</li>`
                : `<li class="breadcrumb-item"><a href="#" data-action="crumb" data-id="${crumb.id}">${safeName}</a></li>`;
        });
        $('#categoryBreadcrumbs').html(html);
    }

    function resetToRoot() {
        $('#subCategoryModal').modal('hide');   // cleanup happens in hidden.bs.modal below
    }

    // When the hierarchy modal closes, reset its state so it can't leak into other saves
    $('#subCategoryModal').on('hidden.bs.modal', function () {
        navigationStack = [];
        $('#currentParentId').val('');
        $('#newSubCatName').val('');
        getCategories();
    });

    async function saveSubCategory() {
        const parentId = $('#currentParentId').val();
        const name = $('#newSubCatName').val().trim();

        if (!parentId) { showAlert("No parent category selected.", "warning"); return; }
        if (!name) { showAlert("Sub-category name is required.", "warning"); return; }

        const formData = new FormData();
        formData.append("name", name);
        formData.append("parent", parentId);

        try {
            const result = await apiRequest(API_BASE_URL, "POST", formData);
            if (!result.ok) { showApiError(result); return; }

            showAlert("Sub-category Created!", "success");
            $('#newSubCatName').val('');
            getCategories('subCategoryTableBody', Number(parentId));
        } catch (err) {
            showAlert("Connection failed!", "danger");
            console.error(err);
        }
    }

    async function deleteCategory(id) {
        if (!confirm("Delete this category? Its sub-categories may be removed too.")) return;

        try {
            const result = await apiRequest(`${API_BASE_URL}${id}/`, "DELETE");
            if (!result.ok) { showApiError(result); return; }

            delete categoryCache[id];
            showAlert("Category Deleted.", "success");

            const parentId = $('#currentParentId').val();
            if (parentId) getCategories('subCategoryTableBody', Number(parentId));
            else getCategories();
        } catch (err) {
            showAlert("Something went wrong!", "danger");
            console.error(err);
        }
    }

    // ---------- Initial load ----------
    getCategories("categoryBody", null);
</script>

{% endblock %}

{% block extra_js %}
{% endblock %}
