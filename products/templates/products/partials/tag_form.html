<form
    method="post"
    action="{% url 'tag_add' product.id %}"
    id="tagForm">

    {% csrf_token %}

    <div id="tagFormAlert"></div>

    {% if form.non_field_errors %}
        <div class="alert alert-danger">
            {{ form.non_field_errors }}
        </div>
    {% endif %}

    <div class="mb-3">
        <label class="form-label">Tag Name</label>

        {{ form.tag_name }}

        {% for error in form.tag_name.errors %}
            <div class="text-danger small">
                {{ error }}
            </div>
        {% endfor %}
    </div>

    <div class="mt-3 text-end">

        <button
            type="button"
            class="btn btn-outline-secondary"
            data-bs-dismiss="modal">
            Cancel
        </button>

        <button
            type="submit"
            class="btn btn-dark"
            id="addTagBtn">
            Add Tag
        </button>

    </div>

</form>

<script>
    function addTagToList(data) {

    const tagContainer =
        document.getElementById("productTags");

    if (!tagContainer) {
        return;
    }

    const tag = document.createElement("span");

    tag.className =
        "badge bg-dark me-1 mb-1";

    tag.dataset.tagId =
        data.tag_id;

    tag.textContent =
        data.tag_name;

    tagContainer.appendChild(tag);
}
function showTagAlert(message, type) {

    const alertBox =
        document.querySelector("#tagFormAlert");

    if (!alertBox) {
        return;
    }

    alertBox.innerHTML = `
        <div
            class="alert alert-${type} alert-dismissible fade show"
            role="alert">

            ${message}

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert">
            </button>

        </div>
    `;
}
document.addEventListener("submit", async function (e) {

    if (!e.target.matches("#tagForm")) {
        return;
    }

    e.preventDefault();

    const form = e.target;

    const submitBtn =
        form.querySelector("#addTagBtn");

    const alertBox =
        form.querySelector("#tagFormAlert");

    if (!submitBtn || !alertBox) {
        return;
    }

    alertBox.innerHTML = "";

    const originalText =
        submitBtn.innerHTML;

    submitBtn.disabled = true;

    submitBtn.innerHTML = `
        <span class="spinner-border spinner-border-sm me-1"></span>
        Adding...
    `;

    try {

        const formData =
            new FormData(form);

        const csrfToken =
            form.querySelector(
                '[name="csrfmiddlewaretoken"]'
            ).value;

        const response = await fetch(
            form.action,
            {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": csrfToken,
                    "X-Requested-With": "XMLHttpRequest"
                }
            }
        );

        const data =
            await response.json();

        console.log("Tag response:", data);

        if (data.success) {

                        window.location.reload();


        } else {

            showTagAlert(
                data.message ||
                "Please correct the errors.",
                "danger"
            );

            /*
             * Replace form with Django
             * validation errors.
             */
            if (data.html) {

                form.outerHTML =
                    data.html;
            }
        }

    } catch (error) {

        console.error(
            "Tag error:",
            error
        );

        showTagAlert(
            "Something went wrong while adding the tag.",
            "danger"
        );

    } finally {

        if (
            submitBtn &&
            document.body.contains(submitBtn)
        ) {

            submitBtn.disabled = false;

            submitBtn.innerHTML =
                originalText;
        }
    }
});
</script>
