<form method="post" action="{% url 'image_add' product.id %}" enctype="multipart/form-data">
    {% csrf_token %}

    {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
    {% endif %}

    <div class="row g-2">
        <div class="col-12">
            <label class="form-label">Image File</label>
            {{ form.image }}
            {% for error in form.image.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        <div class="col-12">
            <label class="form-label">Alt Text</label>
            {{ form.alt_text }}
        </div>
        <div class="col-12">
            <div class="form-check">
                {{ form.is_primary }}
                <label class="form-check-label">Set as primary image</label>
            </div>
        </div>
    </div>

    <div class="mt-3 text-end">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-dark">Save Image</button>
    </div>
</form>
