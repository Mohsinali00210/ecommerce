<!-- Bulk variant editor: edit the existing option groups (e.g. Color: Red,Blue), and the
     variant table follows. Renaming an option value renames every variant that uses it;
     new values add rows; removed values remove rows. Save everything at once. -->
<form id="variantBulkEditForm" method="post"
      action="{% url 'variant_bulk_edit' product.id %}" enctype="multipart/form-data"
      data-options="{{ initial_options_json }}"
      data-variants="{{ initial_variants_json }}">
          {% csrf_token %}
    <div id="beAlert"></div>

    <div id="beInputs"></div>

    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="beIsCustomUI">
        <label class="form-check-label" for="beIsCustomUI">Custom UI For Option</label>
    </div>

    <div class="col-md-4 custom-ui-wrapper mb-3">
        <label class="form-label">Pick Colors</label>
        <div class="d-flex gap-2 align-items-center">
            <input type="color" class="form-control form-control-color" id="beColorPicker" value="#ff0000">
            <button type="button" class="btn btn-sm btn-primary" id="beAddColorBtn">Add</button>
        </div>
        <div id="beColorList" class="mt-2 d-flex flex-wrap gap-2"></div>
    </div>

    <div class="d-flex align-items-center gap-3 mb-3">
        <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="beAutoFill">
            <label class="form-check-label" for="beAutoFill">Auto-fill Price &amp; Stock for all variants</label>
        </div>
        <button type="button" class="btn btn-outline-primary btn-sm" id="beRefreshBtn">
            &#8635; Refresh Variants
        </button>
    </div>

    <div class="table-responsive">
        <table class="table table-sm" id="beTable">
            <thead class="table-light">
                <tr>
                    <th>Variant</th><th>SKU</th><th>Price</th><th>Stock</th><th>Image</th><th></th>
                </tr>
            </thead>
            <tbody></tbody>
            <tfoot>
                <tr>
                    <td colspan="3" class="text-end fw-semibold">Total Stock:</td>
                    <td><input type="text" id="beStockTotal" class="form-control form-control-sm" readonly></td>
                    <td></td><td></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="mt-3 text-end">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-dark" id="beSaveBtn">Save All Variants</button>
    </div>
</form>


<script>
(function () {
    let excluded = []; 
    const SEP = ' / ';   // must match VARIANT_NAME_SEP in the view
    const form = document.getElementById('variantBulkEditForm');
    if (!form) return;

    const inputsBox = form.querySelector('#beInputs');
    const tableBody = form.querySelector('#beTable tbody');
    const initialOptions = JSON.parse(form.dataset.options || '[]');
    const initialVariants = JSON.parse(form.dataset.variants || '[]');
    let variants = initialOptions.map(o => ({ name: o.name, options: [...o.options], colors: [...(o.colors || [])] }));
    let baseline = variants.map(v => ({ name: v.name, options: [...v.options] })); // what the table currently reflects
    let appliedSignature = '';
    let autoFillEnabled = false;
    const deletedIds = new Set();   // existing variants whose option values were removed

    /* ---------- helpers ---------- */
    function showAlert(message, type) {
        const box = form.querySelector('#beAlert');
        box.innerHTML = '';
        const div = document.createElement('div');
        div.className = `alert alert-${type} alert-dismissible fade show`;
        div.setAttribute('role', 'alert');
        div.innerHTML = '<span class="msg"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
        div.querySelector('.msg').textContent = message;
        box.appendChild(div);
    }
    function clearAlert() { form.querySelector('#beAlert').innerHTML = ''; }
    function cartesian(arr) {
        return arr.reduce((a, b) => a.flatMap(d => b.map(e => [...d, e])), [[]]);
    }
    function getPickedColors() {
        return Array.from(form.querySelectorAll('#beColorList .color-box')).map(el => el.dataset.value);
    }
    function parseOptions(text) {
        return text.split(',').map(o => o.trim()).filter(Boolean);
    }
    function signature() {
        const rows = Array.from(inputsBox.querySelectorAll('.variant-row')).map(r => [
            r.querySelector('.variant-name').value.trim(),
            parseOptions(r.querySelector('.variant-options').value).join(','),
        ]).filter(r => r[0] || r[1]);
        return JSON.stringify([rows, getPickedColors()]);
    }

    /* ---------- option input rows ---------- */
    function addVariantInputRow(name, optionsText) {
        const row = document.createElement('div');
        row.className = 'row g-2 mb-2 variant-row';
        row.innerHTML = `
            <div class="col-md-3"><input type="text" class="form-control form-control-sm variant-name" placeholder="Variant Name"></div>
            <div class="col-md-5"><input type="text" class="form-control form-control-sm variant-options" placeholder="Options (comma separated)"></div>
            <div class="col-md-4 d-flex gap-2 align-items-center">
                <button type="button" class="btn btn-dark btn-sm add-variant-btn">Add Variant</button>
                <button type="button" class="btn btn-outline-danger btn-sm remove-variant-btn" title="Remove this option">&times;</button>
            </div>`;
        row.querySelector('.variant-name').value = name || '';
        row.querySelector('.variant-options').value = optionsText || '';
        inputsBox.appendChild(row);
    }

    /* ---------- read + validate the option rows (same rules as the add builder) ---------- */
    function collectVariants() {
        const rows = form.querySelectorAll('#beInputs .variant-row');
        const colorValues = getPickedColors();
        const isCustom = form.querySelector('#beIsCustomUI').checked;
        const collected = [];
        let valid = true;

        rows.forEach(row => {
            const name = row.querySelector('.variant-name').value.trim();
            const optionInput = row.querySelector('.variant-options');
            const options = parseOptions(optionInput.value);

            if (!name && options.length === 0) return;   // untouched blank row
            optionInput.classList.remove('is-invalid');

            if (!name || options.length === 0) {
                showAlert('Enter a variant name and its options.', 'danger');
                valid = false;
                return;
            }
            const isColorVariant = name.toLowerCase().includes('color');
            if (isColorVariant && (isCustom || colorValues.length > 0)) {
                if (options.length !== colorValues.length) {
                    optionInput.classList.add('is-invalid');
                    showAlert(`"${name}": ${options.length} option(s) entered (${options.join(', ')}) but ` +
                              `${colorValues.length} color(s) picked. The counts must match.`, 'danger');
                    valid = false;
                    return;
                }
            }
            collected.push({ name, options, colors: isColorVariant ? colorValues : [] });
        });

        if (valid && collected.length === 0) {
            showAlert('Enter a variant name and its options.', 'danger');
            valid = false;
        }
        if (valid) variants = collected;
        return valid;
    }

    /* ---------- table rows ---------- */
    function buildColorBoxes(combo) {
        let html = '';
        variants.forEach((v, i) => {
            if (v.name.toLowerCase().includes('color') && v.colors && v.colors.length) {
                const optionIndex = v.options.indexOf(combo[i]);
                if (optionIndex !== -1 && v.colors[optionIndex]) {
                    html += `<span title="${combo[i]}" style="display:inline-block;width:18px;height:18px;background:${v.colors[optionIndex]};border:1px solid #ccc;border-radius:3px;margin-right:4px;"></span>`;
                }
            }
        });
        return html;
    }

    function parseParts(name) {
        if (!baseline.length) return null;
        const n = String(name || '').trim();
        const canon = (x, i) => baseline[i].options.find(o => o.toLowerCase() === x.toLowerCase());

        // 1) split by any common separator, case-insensitive
        for (const s of [SEP, '/', ' - ', '-', ',', '|']) {
            const p = n.split(s).map(x => x.trim());
            if (p.length !== baseline.length) continue;
            const parts = p.map(canon);
            if (parts.every(Boolean)) return parts;
        }

        // 2) find each group's option inside the name (whole-word, longest match wins)
        const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const parts = baseline.map(g => {
            const hits = g.options.filter(o =>
                new RegExp('(^|[^a-z0-9])' + esc(o) + '($|[^a-z0-9])', 'i').test(n));
            hits.sort((a, b) => b.length - a.length);
            return hits[0] || null;
        });
        return parts.every(Boolean) ? parts : null;
    }

    function setLinkedName(tr, name) {
        tr.querySelector('.variantName').value = name;
        tr.querySelector('.variant-label').textContent = name;
    }

    function createRow(d) {
        const tr = document.createElement('tr');
        tr.dataset.id = d.id || '';
        tr._parts = d.parts;
        tr.innerHTML = `
            <td>
                <span class="color-boxes"></span>
                <span class="variant-label"></span>
                <input class="variantName">
            </td>
            <td><input type="text" class="form-control form-control-sm variantSku"></td>
            <td><input type="number" step="0.01" min="0" class="form-control form-control-sm variantPrice" placeholder="Price"></td>
            <td><input type="number" min="0" class="form-control form-control-sm variantStockQTY" placeholder="Stock"></td>
            <td>
                <div class="current-image mb-1"></div>
                <input type="file" class="variant-images" accept="image/*">
                <div class="image-preview d-flex flex-wrap gap-1 mt-1"></div>
            </td>
            <td class="text-center">
                <button type="button" class="btn btn-sm btn-outline-danger remove-row-btn" title="Remove this variant"><i class="bi bi-trash"></i></button>
            </td>`;
        const nameInput = tr.querySelector('.variantName');
        if (d.parts) {
            nameInput.type = 'hidden';
        } else {
            nameInput.type = 'text';
            nameInput.className = 'form-control form-control-sm variantName';
        }
        setLinkedName(tr, d.name);
        tr.querySelector('.variantSku').value = d.sku || '';
        tr.querySelector('.variantPrice').value = d.price ?? '';
        tr.querySelector('.variantStockQTY').value = d.stock ?? '';
        if (d.image_url) {
            const img = document.createElement('img');
            img.src = d.image_url;
            img.style.cssText = 'width:44px;height:44px;object-fit:cover;border:1px solid #ddd;border-radius:4px;';
            tr.querySelector('.current-image').appendChild(img);
        }
        bindImagePreview(tr.querySelector('.variant-images'));
        return tr;
    }

    /* maps old option value -> new option value for one option group */
    function buildMap(oldOpts, newOpts) {
        const m = {};
        const usedNew = new Set();
        oldOpts.forEach(o => { if (newOpts.includes(o)) { m[o] = o; usedNew.add(o); } });
        const oldLeft = oldOpts.filter(o => !(o in m));
        const newLeft = newOpts.filter(n => !usedNew.has(n));
        const n = Math.min(oldLeft.length, newLeft.length);       // leftover values are treated as renames, in order
        for (let k = 0; k < n; k++) m[oldLeft[k]] = newLeft[k];
        return m;
    }

    /* rebuild the table from the option inputs; existing rows keep their id/sku/price/stock/image */
    function generateCombinations() {
        const sameShape = baseline.length === variants.length;
        const maps = variants.map((nv, i) => sameShape ? buildMap(baseline[i].options, nv.options) : null);

        // translate old option values -> new ones (null if the combo no longer exists)
        const mapParts = parts => {
            if (sameShape) {
                const m = parts.map((p, i) => maps[i][p]);
                return m.some(x => x === undefined) ? null : m;
            }
            return (parts.length === variants.length &&
                    parts.every((p, i) => variants[i].options.includes(p))) ? parts.slice() : null;
        };

        const pool = Array.from(tableBody.querySelectorAll('tr'));
        const byKey = new Map();
        const custom = [];
        let removedExisting = 0;

        pool.forEach(tr => {
            if (!tr._parts) { custom.push(tr); return; }
            const mapped = mapParts(tr._parts);
            if (mapped) {
                const key = mapped.join(SEP);
                if (!byKey.has(key)) { byKey.set(key, { tr, mapped }); return; }
            }
            if (tr.dataset.id) { deletedIds.add(tr.dataset.id); removedExisting++; }
        });

        excluded = excluded.map(mapParts).filter(Boolean);
        const excludedKeys = new Set(excluded.map(p => p.join(SEP)));

        const prodName = ((document.getElementById('id_name') || {}).value || '').replace(/\s+/g, '');
        const fragment = document.createDocumentFragment();

        cartesian(variants.map(v => v.options)).forEach(combo => {
            const key = combo.join(SEP);
            const hit = byKey.get(key);
            if (!hit && excludedKeys.has(key)) return;   // user removed this one

            let tr;
            if (hit) {
                tr = hit.tr;
                tr._parts = combo;
            } else {
                const sku = 'SKU-' + prodName.substring(0, 5).toUpperCase() + '-' + combo.join('-').toUpperCase();
                tr = createRow({ id: '', name: key, sku, parts: combo });
            }
            setLinkedName(tr, key);
            tr.querySelector('.color-boxes').innerHTML = buildColorBoxes(combo);
            fragment.appendChild(tr);
        });
        custom.forEach(tr => fragment.appendChild(tr));

        tableBody.innerHTML = '';
        tableBody.appendChild(fragment);

        baseline = variants.map(v => ({ name: v.name, options: [...v.options] }));
        appliedSignature = signature();
        updateStockTotal();
        return removedExisting;
    }

    function updateStockTotal() {
        const total = Array.from(form.querySelectorAll('.variantStockQTY'))
            .reduce((sum, input) => sum + (parseFloat(input.value) || 0), 0);
        form.querySelector('#beStockTotal').value = total;
    }

    function bindImagePreview(input) {
        input.addEventListener('change', function () {
            const previewDiv = this.nextElementSibling;
            previewDiv.innerHTML = '';
            Array.from(this.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = e => {
                    const container = document.createElement('div');
                    container.style.cssText = 'position:relative;display:inline-block;';
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.cssText = 'width:50px;height:50px;object-fit:cover;border:1px solid #ddd;border-radius:4px;';
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.innerHTML = '&times;';
                    btn.className = 'btn btn-sm btn-danger';
                    btn.style.cssText = 'position:absolute;top:-5px;right:-5px;padding:0px 5px;line-height:1;font-size:12px;border-radius:50%;';
                    btn.addEventListener('click', () => { input.value = ''; container.remove(); });
                    container.append(img, btn);
                    previewDiv.appendChild(container);
                };
                reader.readAsDataURL(file);
            });
        });
    }

    function addColorBox(colorValue) {
        const box = document.createElement('span');
        box.className = 'color-box';
        box.dataset.value = colorValue;
        box.title = colorValue;
        box.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid #ccc;border-radius:4px;background:#fff;';
        box.innerHTML = `<span style="display:inline-block;width:16px;height:16px;background:${colorValue};border-radius:3px;border:1px solid #999;"></span><button type="button" class="btn-close" style="font-size:9px;" aria-label="Remove"></button>`;
        box.querySelector('button').addEventListener('click', () => box.remove());
        form.querySelector('#beColorList').appendChild(box);
    }

    function applyAndReport() {
        const removed = generateCombinations();
        if (removed > 0) {
            showAlert(`${removed} existing variant(s) no longer match the options and will be deleted when you save.`, 'warning');
        }
    }

    /* ---------- initial render from the database ---------- */
    initialOptions.forEach(o => addVariantInputRow(o.name, o.options.join(', ')));
    if (initialOptions.length === 0) addVariantInputRow('', '');

    const colorGroup = initialOptions.find(o => o.name.toLowerCase().includes('color'));
    if (colorGroup && colorGroup.colors) {
        colorGroup.colors.filter(Boolean).forEach(addColorBox);
        if (colorGroup.colors.some(Boolean)) form.querySelector('#beIsCustomUI').checked = true;
    }

    initialVariants.forEach(v => {
        const tr = createRow({
            id: v.id, name: v.name, sku: v.sku, price: v.price, stock: v.stock,
            image_url: v.image_url, parts: parseParts(v.name),
        });
        if (tr._parts) tr.querySelector('.color-boxes').innerHTML = buildColorBoxes(tr._parts);
        tableBody.appendChild(tr);
    });
    updateStockTotal();
    appliedSignature = signature();

    /* ---------- events ---------- */
    form.addEventListener('click', function (e) {
        if (e.target.classList.contains('remove-variant-btn')) {
            const rows = inputsBox.querySelectorAll('.variant-row');
            const row = e.target.closest('.variant-row');
            if (rows.length === 1) {
                row.querySelector('.variant-name').value = '';
                row.querySelector('.variant-options').value = '';
            } else {
                row.remove();
            }
            return;
        }
        if (!e.target.classList.contains('add-variant-btn')) return;
        if (!collectVariants()) return;
        clearAlert();

        const rows = inputsBox.querySelectorAll('.variant-row');
        const lastRow = rows[rows.length - 1];
        const lastFilled = lastRow.querySelector('.variant-name').value.trim() ||
                           lastRow.querySelector('.variant-options').value.trim();
        if (lastFilled && rows.length < 4) addVariantInputRow('', '');

        applyAndReport();
    });

    form.querySelector('#beRefreshBtn').addEventListener('click', function () {
        if (!collectVariants()) return;
        clearAlert();
        applyAndReport();
    });

    tableBody.addEventListener('input', function (e) {
        const input = e.target;
        if (input.tagName !== 'INPUT') return;
        const isPrice = input.classList.contains('variantPrice');
        const isStock = input.classList.contains('variantStockQTY');
        if (autoFillEnabled && (isPrice || isStock)) {
            const selector = isPrice ? '.variantPrice' : '.variantStockQTY';
            tableBody.querySelectorAll(selector).forEach(other => {
                if (other !== input) other.value = input.value;
            });
        }
        if (isStock) updateStockTotal();
    });
    tableBody.addEventListener('click', function (e) {
        const btn = e.target.closest('.remove-row-btn');
        if (!btn) return;
        const tr = btn.closest('tr');
        if (tr.dataset.id) {
            deletedIds.add(tr.dataset.id);
            showAlert('Variant removed. It will be permanently deleted when you save.', 'warning');
        }
        if (tr._parts) excluded.push(tr._parts.slice());
        tr.remove();
        updateStockTotal();
    });
    form.querySelector('#beAutoFill').addEventListener('change', function () {
        autoFillEnabled = this.checked;
    });

    form.querySelector('#beAddColorBtn').addEventListener('click', function () {
        addColorBox(form.querySelector('#beColorPicker').value);
    });

    /* ---------- submit (validate, then post) ---------- */
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        e.stopPropagation();

        if (signature() !== appliedSignature) {
            showAlert('The options were changed. Click "Refresh Variants" to update the table before saving.', 'danger');
            return;
        }
        const rows = tableBody.querySelectorAll('tr');
        if (rows.length === 0) {
            showAlert('There are no variants to save.', 'danger');
            return;
        }
        let hasError = false;
        rows.forEach(row => {
            if (!row.querySelector('.variantSku').value.trim() || !row.querySelector('.variantPrice').value) hasError = true;
        });
        if (hasError) {
            showAlert('Every variant row needs a SKU and a Price before saving.', 'danger');
            return;
        }
        if (deletedIds.size > 0 &&
            !confirm(`${deletedIds.size} existing variant(s) will be permanently deleted. Continue?`)) return;

        const variantsData = Array.from(rows).map(row => ({
            id: row.dataset.id || null,
            name: row.querySelector('.variantName').value,
            sku: row.querySelector('.variantSku').value,
            price: row.querySelector('.variantPrice').value,
            stock_quantity: row.querySelector('.variantStockQTY').value
        }));
        const optionsData = variants.map(v => ({
            option_name: v.name,
            option: v.options,
            value: v.colors || []
        }));

        const formData = new FormData();
        formData.append('csrfmiddlewaretoken', form.querySelector('[name=csrfmiddlewaretoken]').value);
        formData.append('variants', JSON.stringify(variantsData));
        formData.append('options', JSON.stringify(optionsData));
        formData.append('deleted_ids', JSON.stringify(Array.from(deletedIds)));
        rows.forEach((row, index) => {
            const file = row.querySelector('.variant-images').files[0];
            if (file) formData.append(`variants[${index}][image]`, file);
        });

        const saveBtn = form.querySelector('#beSaveBtn');
        saveBtn.disabled = true;
        try {
            const response = await fetch(form.action, {
                method: 'POST', body: formData, credentials: 'same-origin',
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();
            alert(data.message);
            if (data.success) window.location.reload();
        } catch (err) {
            console.error(err);
            alert('Something went wrong.');
        }
        saveBtn.disabled = false;
    });
    
})();
</script>
