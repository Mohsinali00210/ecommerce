{% extends "base.html" %}

{% block title %}Pictures{% endblock %}

{% block content %}

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <i class="bi bi-images"></i> Pictures
        </div>

        <button class="btn btn-dark btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#pictureModal"
                onclick="clearPictureModal()">
            <i class="bi bi-plus-circle"></i> Add Picture
        </button>
    </div>

    <div class="card-body p-0">
        <table class="table table-sm table-bordered mb-0 align-middle">
            <thead class="table-light">
                <tr>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Image</th>
                    <th style="width:70px;">Order</th>
                    <th>Status</th>
                    <th style="width:120px;">Action</th>
                </tr>
            </thead>

            <tbody id="picturesBody"></tbody>
        </table>
    </div>
</div>


<!-- Modal -->

<div class="modal fade" id="pictureModal" tabindex="-1">
    <div class="modal-dialog modal-md">

        <div class="modal-content">

            <div class="modal-header">
                <h6 class="modal-title">
                    <i class="bi bi-images"></i> Picture Management
                </h6>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <input type="hidden" id="PictureId">

                <div class="row g-2">

                    <div class="col-md-12">
                        <label class="form-label">Picture Type</label>

                        <select class="form-select form-select-sm" id="PictureType" onchange="toggleSlideFields()">
                            <option value="banner">Banner</option>
                            <option value="slider">Slider</option>
                            <option value="gallery">Gallery</option>
                        </select>
                    </div>

                    <!-- Slider-only text fields -->
                    <div class="col-md-12" id="eyebrowGroup">
                        <label class="form-label">Eyebrow <small class="text-muted">(small text above the title)</small></label>
                        <input type="text"
                               class="form-control form-control-sm"
                               id="PictureEyebrow"
                               maxlength="100"
                               placeholder="e.g. New Season">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Title</label>
                        <textarea class="form-control form-control-sm"
                                  id="PictureTitle"
                                  rows="2"
                                  maxlength="200"></textarea>
                        <small class="text-muted slide-only">Press Enter for a line break in the heading.</small>
                    </div>

                    <div class="col-md-12 slide-only">
                        <label class="form-label">Description</label>
                        <textarea class="form-control form-control-sm"
                                  id="PictureDescription"
                                  rows="2"></textarea>
                    </div>

                    <div class="col-md-6 slide-only">
                        <label class="form-label">Button Text</label>
                        <input type="text"
                               class="form-control form-control-sm"
                               id="PictureButtonText"
                               maxlength="50"
                               placeholder="e.g. Shop Now">
                    </div>

                    <div class="col-md-6 slide-only">
                        <label class="form-label">Button Link</label>
                        <input type="text"
                               class="form-control form-control-sm"
                               id="PictureButtonLink"
                               maxlength="255"
                               placeholder="e.g. /shop/">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Alt Text</label>
                        <input type="text"
                               class="form-control form-control-sm"
                               id="PictureAlt">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Sort Order <small class="text-muted">(lower shows first)</small></label>
                        <input type="number"
                               class="form-control form-control-sm"
                               id="PictureSortOrder"
                               min="0"
                               value="0">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Image <small class="text-muted slide-only">(recommended 1920×700)</small></label>
                        <input type="file"
                               class="form-control form-control-sm"
                               id="PictureImage"
                               accept="image/*">

                        <div id="imagePreview"></div>
                    </div>

                    <div class="col-md-12 mt-2">
                        <input class="form-check-input"
                               type="checkbox"
                               id="Active"
                               checked>

                        <label class="form-check-label">
                            Active
                        </label>
                    </div>

                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-dark btn-sm w-100"
                        id="savePictureBtn"
                        onclick="savePicture()">
                    Save Picture
                </button>
            </div>

        </div>

    </div>
</div>

<script>

const API_BASE_URL = `${window.location.origin}/Adminpanel/Products/api/v1/pictures/`;

// id -> item, so the edit button never has to embed JSON in an onclick attribute
// (text like "we've" would break it)
let picturesCache = {};

getPictures();


/* Escape text before putting it into innerHTML */

function esc(value) {
    return $('<div>').text(value ?? '').html();
}


/* Show slide-only fields only for the slider type */

function toggleSlideFields() {
    const isSlider = $("#PictureType").val() === "slider";
    $(".slide-only").toggle(isSlider);
    $("#eyebrowGroup").toggle(isSlider);
}


/* Image Preview */

$("#PictureImage").change(function () {

    const file = this.files[0];

    if (file) {

        let reader = new FileReader();

        reader.onload = function (event) {

            $("#imagePreview").html(
                `<img src="${event.target.result}" 
                class="img-thumbnail mt-2"
                style="max-height:100px">`
            );
        };

        reader.readAsDataURL(file);
    }
});


/* Load Pictures */

function getPictures(el="picturesBody") {

fetch(API_BASE_URL, {

    headers:{
        "Authorization":`Bearer ${localStorage.getItem("access_token")}`
    }

})
.then(res=>res.json())
.then(data=>{

// works with or without DRF pagination
const items = Array.isArray(data) ? data : (data.results || []);

picturesCache = {};

let innerHtml="";

items.forEach(item=>{

picturesCache[item.id] = item;

innerHtml += `
<tr>

<td>${esc(item.picture_type)}</td>

<td>${esc(item.title)}</td>

<td>
<img src="${item.picture}"
style="width:60px"
class="img-fluid">
</td>

<td>${item.sort_order ?? 0}</td>

<td>
<span class="badge ${item.is_active ? 'bg-success' : 'bg-secondary'}">
${item.is_active ? 'Active' : 'Inactive'}
</span>
</td>

<td>

<button class="btn btn-outline-secondary btn-sm"

onclick="editPicture(${item.id})"

data-bs-toggle="modal"
data-bs-target="#pictureModal">

<i class="bi bi-pencil"></i>

</button>

</td>

</tr>
`;

});

if(items.length === 0){

innerHtml = `<tr>
<td colspan="6" class="text-center text-muted">
No pictures found
</td>
</tr>`;

}

$(`#${el}`).html(innerHtml);

});

}


/* Edit */

function editPicture(id){
    clearPictureModal();
    fillPictureModal(picturesCache[id]);
}


/* Fill modal for edit */

function fillPictureModal(item){

$("#PictureId").val(item.id);
$("#PictureType").val(item.picture_type);
$("#PictureEyebrow").val(item.eyebrow ?? '');
$("#PictureTitle").val(item.title ?? '');
$("#PictureDescription").val(item.description ?? '');
$("#PictureButtonText").val(item.button_text ?? '');
$("#PictureButtonLink").val(item.button_link ?? '');
$("#PictureAlt").val(item.alt ?? '');
$("#PictureSortOrder").val(item.sort_order ?? 0);
$("#Active").prop('checked',item.is_active);

$("#imagePreview").html(
`<img src="${item.picture}" class="img-thumbnail" style="max-height:100px">`
);

toggleSlideFields();

}


/* Clear modal */

function clearPictureModal(){

$("#PictureId").val("");
$("#PictureType").val("banner");
$("#PictureEyebrow").val("");
$("#PictureTitle").val("");
$("#PictureDescription").val("");
$("#PictureButtonText").val("");
$("#PictureButtonLink").val("");
$("#PictureAlt").val("");
$("#PictureSortOrder").val(0);
$("#Active").prop('checked',true);
$("#PictureImage").val("");
$("#imagePreview").html("");

toggleSlideFields();

}


/* Save Picture */

function savePicture(){

let PictureId = $("#PictureId").val();

let imageFile = document.querySelector('#PictureImage').files[0];

// A new picture must have an image
if(PictureId === '' && !imageFile){
    showAlert("Please choose an image","danger");
    return;
}

let formData = new FormData();

formData.append('picture_type',$("#PictureType").val());
formData.append('eyebrow',$("#PictureEyebrow").val());
formData.append('title',$("#PictureTitle").val());
formData.append('description',$("#PictureDescription").val());
formData.append('button_text',$("#PictureButtonText").val());
formData.append('button_link',$("#PictureButtonLink").val());
formData.append('alt',$("#PictureAlt").val());
formData.append('sort_order',$("#PictureSortOrder").val() || 0);
formData.append('is_active',$("#Active").is(':checked'));

if(imageFile){
formData.append('picture',imageFile);
}

let url = PictureId === '' ? API_BASE_URL : `${API_BASE_URL}${PictureId}/`;
let method = PictureId === '' ? "POST" : "PATCH";

$("#savePictureBtn").prop("disabled", true);

fetch(url,{
method:method,
headers:{
"Authorization":`Bearer ${localStorage.getItem("access_token")}`
},
body:formData
})

// Treat validation / permission errors as errors (before, they showed "Picture Created!")
.then(async res=>{
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw data;
    return data;
})
.then(data=>{

$("#pictureModal").modal('hide');

getPictures();

showAlert(
PictureId === '' ? "Picture Created!" : "Picture Updated!",
"success"
);

})
.catch(err=>{
const msg = (err && typeof err === 'object')
    ? Object.values(err).flat().join(' ')
    : "";
showAlert(msg || "Error saving picture","danger");
console.error(err);
})
.finally(()=>{
$("#savePictureBtn").prop("disabled", false);
});

}

</script>

{% endblock %}
