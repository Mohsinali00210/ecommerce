{% extends "base.html" %}

{% block content %}

<div class="card">

<div class="card-header d-flex justify-content-between">
    <div>
        <i class="bi bi-box"></i> Variant Inventory
    </div>

    <button class="btn btn-dark btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#inventoryModal"
            onclick="clearInventoryModal()">

        Add Inventory
    </button>
</div>

<div class="card-body p-0">

<table class="table table-sm table-bordered">

<thead class="table-light">
<tr>
    <th>Product</th>
    <th>Variant</th>
    <th>Quantity</th>
    <th>Old Price</th>
    <th>New Price</th>
    <th>Date</th>
</tr>
</thead>

<tbody id="inventoryBody"></tbody>

</table>

</div>
</div>


<div class="modal fade" id="inventoryModal">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">
<h6>Variant Inventory</h6>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<input type="hidden" id="InventoryId">

<div class="mb-2">
<label>Variant</label>
<select class="form-select form-select-sm" id="Variant"></select>
</div>

<div class="mb-2">
<label>Quantity</label>
<input type="number" class="form-control form-control-sm" id="Quantity">
</div>

<div class="mb-2">
<label>New Price</label>
<input type="number" class="form-control form-control-sm" id="NewPrice">
</div>

<div class="mb-2">
<label>Notes</label>
<textarea class="form-control form-control-sm" id="Notes"></textarea>
</div>

</div>

<div class="modal-footer">
<button class="btn btn-dark w-100"
        onclick="saveInventory()">

Save
</button>
</div>

</div>
</div>
</div>


<script>
    const INVENTORY_API = "/Adminpanel/Products/api/v1/inventory/";

getInventory();
getVariants();

function getInventory(){

fetch(INVENTORY_API,{
headers:{
"Authorization":`Bearer ${localStorage.getItem("access_token")}`
}
})
.then(res=>res.json())
.then(data=>{

let html="";

data.forEach(item=>{

html+=`
<tr>
<td>${item.product_name}</td>
<td>${item.variant_name}</td>
<td>${item.quantity}</td>
<td>${item.old_price}</td>
<td>${item.new_price}</td>
<td>${item.created_at}</td>
</tr>
`;

});

$("#inventoryBody").html(html);

});

}

function saveInventory(){

let variant=$("#Variant").val();
let quantity=$("#Quantity").val();
let new_price=$("#NewPrice").val();
let notes=$("#Notes").val();

fetch(INVENTORY_API,{

method:"POST",

headers:{
"Authorization":`Bearer ${localStorage.getItem("access_token")}`,
"Content-Type":"application/json"
},

body:JSON.stringify({
variant:variant,
quantity:quantity,
new_price:new_price,
notes:notes
})

})
.then(res=>res.json())
.then(data=>{

$("#inventoryModal").modal("hide");

getInventory();

});

}
function getVariants(){

fetch("/Adminpanel/Products/api/v1/product-variants/",{

headers:{
"Authorization":`Bearer ${localStorage.getItem("access_token")}`
}

})
.then(res=>res.json())
.then(data=>{

let html="";

data.forEach(v=>{
html+=`<option value="${v.id}">
${v.product_name} - ${v.name}
</option>`;
});

$("#Variant").html(html);

});

}
</script>

{% endblock %}
