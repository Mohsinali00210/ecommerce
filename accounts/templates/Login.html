<!DOCTYPE html>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/solid.min.css">
    <style>
        body, html {
            height: 100%;
        }
        .login-container {
            height: 100vh;
        }
        .login-left {
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-left i {
            font-size: 6rem;
            color: #0d6efd;
        }
        .login-right {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-form {
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>
    <div class="container-fluid login-container">
        <div class="row h-100">
            <!-- Left Section: Shopping Icon -->
            <div class="col-md-6 login-left d-none d-md-flex">
               <i class="fa-solid fa-cart-flatbed-suitcase"></i>
            </div>

            <!-- Right Section: Form -->
            <div class="col-md-6 login-right">
                <form method="POST" class="login-form bg-white p-4 shadow rounded">
                    {% csrf_token %}
                    <h3 class="mb-3 text-center">Login</h3>
                    
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Login</button>
                    <a href="'socialaccount_login' 'google' " class="btn btn-danger w-100 mt-2">Continue with Google</a>

                    <div class="text-center mt-2">
                        <a href="{% url 'register' %}">Register</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
