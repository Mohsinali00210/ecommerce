<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyShop</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome (fixed CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #0d6efd, #6c63ff);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            display: flex;
            background: #fff;
        }

        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-left i {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .login-right {
            flex: 1;
            padding: 40px;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #0d6efd;
        }

        .btn-google {
            background: #db4437;
            color: white;
        }

        .btn-google:hover {
            background: #c1351d;
            color: white;
        }

        .toggle-password {
            cursor: pointer;
        }

        .spinner-border {
            width: 1rem;
            height: 1rem;
        }
    </style>
</head>

<body>

<div class="login-card">

    <!-- LEFT SIDE -->
    <div class="login-left d-none d-md-flex">
        <i class="fa-solid fa-cart-shopping"></i>
        <h3>Welcome Back</h3>
        <p class="text-center">Login to manage your shop, orders & customers easily</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">

        <h3 class="mb-4 text-center">Login</h3>

        <form method="POST" id="loginForm">
            {% csrf_token %}

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter password" required>
                    <span class="input-group-text toggle-password" onclick="togglePassword()">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                Login
            </button>

            {% load socialaccount %}
            <a href="{% provider_login_url 'google' %}" class="btn btn-google w-100 mt-3">
                <i class="fa-brands fa-google me-2"></i> Continue with Google
            </a>

            <div class="text-center mt-3">
                <a href="{% url 'register' %}">Create an account</a>
            </div>
        </form>

    </div>
</div>

<script>
    // Toggle Password
    function togglePassword() {
        const input = document.getElementById("password");
        const icon = event.target;

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    // Loading spinner on submit
    document.getElementById("loginForm").addEventListener("submit", function () {
        const btn = document.getElementById("loginBtn");
        btn.innerHTML = `<span class="spinner-border"></span> Logging in...`;
        btn.disabled = true;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
