{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Continue with Google</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow text-center" style="width: 420px; border-radius: 12px;">

        <h4 class="mb-3">Sign in with Google</h4>

        <p class="text-muted">
            You are about to sign in using your Google account.
        </p>

        <!-- Continue Button -->
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger w-100 d-flex align-items-center justify-content-center gap-2">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20">
                Continue with Google
            </button>
        </form>

        <hr>

        <a href="{% url 'account_login' %}" class="btn btn-outline-secondary w-100">
            Cancel
        </a>

    </div>
</div>

</body>
</html>
