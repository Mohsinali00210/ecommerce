<style>
    .cat-strip {
        width: 100%;
        overflow: hidden;
    }

    .cat-strip-track {
        display: flex;
        width: max-content;
        animation: categoryMarquee 30s linear infinite;
    }

    .cat-strip-group {
        display: flex;
        align-items: center;
        gap: 24px;
        padding-right: 24px;
        flex-shrink: 0;
    }

    .cat-circle-item {
        flex: 0 0 auto;
        width: 90px;
        text-align: center;
        text-decoration: none;
        color: inherit;
    }

    .cat-circle {
        width: 76px;
        height: 76px;
        margin: 0 auto 7px;
        border-radius: 50%;
        overflow: hidden;
    }

    .cat-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .cat-circle-item span {
        display: block;
        /* white-space: nowrap; */
        font-size: 13px;
    }

    /* LEFT → RIGHT */
    @keyframes categoryMarquee {
        from {
            transform: translateX(-50%);
        }

        to {
            transform: translateX(0);
        }
    }

    .cat-strip-track:hover {
        animation-play-state: paused;
    }
</style>
<div class="cat-strip">
    <div class="cat-strip-track">

        <div class="cat-strip-group">

            {% for category in categories %}
                <a href="/search-products/?category={{ category.id }}"
                   class="cat-circle-item">

                    <div class="cat-circle">
                        {% if category.image %}
                            <img src="{{ category.image.url }}"
                                 alt="{{ category.name }}">
                        {% else %}
                            <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=200&q=80"
                                 alt="{{ category.name }}">
                        {% endif %}
                    </div>

                    <span>{{ category.name }}</span>

                </a>
            {% endfor %}

        </div>

        <!-- Duplicate for seamless loop -->
        <div class="cat-strip-group" aria-hidden="true">

            {% for category in categories %}
                <a href="/search-products/?category={{ category.id }}"
                   class="cat-circle-item">

                    <div class="cat-circle">
                        {% if category.image %}
                            <img src="{{ category.image.url }}"
                                 alt="{{ category.name }}">
                        {% else %}
                            <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=200&q=80"
                                 alt="{{ category.name }}">
                        {% endif %}
                    </div>

                    <span>{{ category.name }}</span>

                </a>
            {% endfor %}

        </div>

    </div>
</div>
