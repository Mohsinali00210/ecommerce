<style>
    .cat-strip {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        cursor: grab;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }

    .cat-strip::-webkit-scrollbar { display: none; }
    .cat-strip.is-dragging { cursor: grabbing; }

    .cat-strip-track {
        display: flex;
        width: max-content;
    }

    .cat-strip-group {
        display: flex;
        align-items: center;
        gap: 24px;
        padding-right: 24px;
        flex-shrink: 0;
    }

    .cat-circle-item {
        flex: 0 0 auto;
        width: 90px;
        text-align: center;
        text-decoration: none;
        color: inherit;
    }

    .cat-circle {
        width: 76px;
        height: 76px;
        margin: 0 auto 7px;
        border-radius: 50%;
        overflow: hidden;
    }

    .cat-circle img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    {% comment %} .cat-circle-item span {
        display: block;
        /* white-space: nowrap; */
        font-size: 13px;
    } {% endcomment %}
    .cat-circle-item span {
        display: block;
        font-size: 13px;
        white-space: nowrap;       /* one row only */
        overflow: hidden;          /* hide the overflow */
        text-overflow: ellipsis;   /* show "..." */
    }

    .cat-strip { padding-bottom: 34px; }

.cat-circle-item { position: relative; }

.cat-circle-item::after {
    content: attr(data-name);
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--on-accent);
    font-size: 12px;
    padding: 2px 22px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
    z-index: 10;
}

.cat-circle-item:hover::after { opacity: 1; }
</style>
<div class="cat-strip">
    <div class="cat-strip-track">

        <div class="cat-strip-group">

            {% for category in categories %}
                <a href="/search-products/?category={{ category.id }}"
                        class="cat-circle-item"
                        title="{{ category.name }}">

                    <div class="cat-circle">
                        {% if category.image %}
                            <img src="{{ category.image.url }}"
                                 alt="{{ category.name }}">
                        {% else %}
                            <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=200&q=80"
                                 alt="{{ category.name }}">
                        {% endif %}
                    </div>

                    <span>{{ category.name }}</span>

                </a>
            {% endfor %}

        </div>

        <div class="cat-strip-group" aria-hidden="true">
            {% for category in categories %}
                <a href="/search-products/?category={{ category.id }}"
                   class="cat-circle-item"
                   title="{{ category.name }}"
                   tabindex="-1">
                    <div class="cat-circle">
                        {% if category.image %}
                            <img src="{{ category.image.url }}" alt="{{ category.name }}">
                        {% else %}
                            <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=200&q=80" alt="{{ category.name }}">
                        {% endif %}
                    </div>
                    <span>{{ category.name }}</span>
                </a>
            {% endfor %}
        </div>

    </div>
</div>

<script>
    document.querySelectorAll('.cat-strip:not([data-drag-ready])').forEach((strip) => {
        strip.dataset.dragReady = 'true';
        const track = strip.querySelector('.cat-strip-track');
        const firstGroup = track?.querySelector('.cat-strip-group');
        if (!track || !firstGroup) return;

        let startX = 0;
        let startScrollLeft = 0;
        let dragged = false;
        let paused = false;
        let resumeTimer;
        let previousFrame = 0;
        let groupWidth = 0;

        const ensureLoopContent = () => {
            groupWidth = firstGroup.getBoundingClientRect().width;
            if (!groupWidth) return;

            while (track.scrollWidth < groupWidth + strip.clientWidth) {
                const clone = firstGroup.cloneNode(true);
                clone.setAttribute('aria-hidden', 'true');
                clone.querySelectorAll('a').forEach((link) => {
                    link.tabIndex = -1;
                });
                track.appendChild(clone);
            }
        };
        ensureLoopContent();
        window.addEventListener('resize', ensureLoopContent);

        const resumeAfterInteraction = () => {
            window.clearTimeout(resumeTimer);
            resumeTimer = window.setTimeout(() => {
                paused = false;
            }, 800);
        };

        const moveAutomatically = (time) => {
            if (previousFrame && !paused && !document.hidden && groupWidth) {
                strip.scrollLeft += Math.min(time - previousFrame, 40) * 0.035;
                if (strip.scrollLeft >= groupWidth) {
                    strip.scrollLeft %= groupWidth;
                }
            }
            previousFrame = time;
            window.requestAnimationFrame(moveAutomatically);
        };
        window.requestAnimationFrame(moveAutomatically);

        strip.addEventListener('mouseenter', () => { paused = true; });
        strip.addEventListener('mouseleave', () => { paused = false; });

        strip.addEventListener('pointerdown', (event) => {
            paused = true;
            if (event.pointerType !== 'mouse' || event.button !== 0) return;
            startX = event.clientX;
            startScrollLeft = strip.scrollLeft;
            dragged = false;
            strip.setPointerCapture(event.pointerId);
        });

        strip.addEventListener('pointermove', (event) => {
            if (!strip.hasPointerCapture(event.pointerId)) return;
            const distance = event.clientX - startX;
            if (Math.abs(distance) > 4) {
                dragged = true;
                strip.classList.add('is-dragging');
                strip.scrollLeft = startScrollLeft - distance;
            }
        });

        const stopDragging = (event) => {
            if (strip.hasPointerCapture(event.pointerId)) {
                strip.releasePointerCapture(event.pointerId);
            }
            strip.classList.remove('is-dragging');
            resumeAfterInteraction();
        };

        strip.addEventListener('pointerup', stopDragging);
        strip.addEventListener('pointercancel', stopDragging);
        strip.addEventListener('click', (event) => {
            if (dragged) {
                event.preventDefault();
                event.stopPropagation();
                dragged = false;
            }
        }, true);
    });
</script>
