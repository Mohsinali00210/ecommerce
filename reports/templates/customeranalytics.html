{% extends "base.html" %}
{% block title %}Customer Analytics{% endblock %}

{% block content %}

<style>
.card {
    border-radius: 10px;
}
.card-header {
    font-size: 14px;
}
canvas {
    max-height: 250px;
}
</style>
<div class="card">

    <!-- Header -->
    <div class="card-header d-flex justify-content-between">
        <div><i class="bi bi-people"></i> Customer Analytics</div>

        <div>
            <button class="btn btn-dark btn-sm" onclick="loadAnalytics()">
                <i class="bi bi-arrow-repeat"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="card-body">

        <!-- Charts -->
        <div class="row g-4">

            <!-- Top Buyers -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-light">
                        <strong>🏆 Top Buyers</strong>
                    </div>
                    <div class="card-body">
                        <canvas id="topBuyersChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Repeat Customers -->
            <div class="col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-light">
                        <strong>🔁 Repeat Customers</strong>
                    </div>
                    <div class="card-body">
                        <canvas id="repeatChart"></canvas>
                    </div>
                </div>
            </div>

        </div>

        <!-- Table -->
        <div class="card mt-4 border-0 shadow-sm">
            <div class="card-header bg-light">
                <strong>📊 Customer Details</strong>
            </div>

            <div class="card-body p-0">
                <table class="table table-sm table-bordered text-center mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Type</th>
                            <th>Customer</th>
                            <th>Orders</th>
                            <th>Total Spent</th>
                        </tr>
                    </thead>
                    <tbody id="customerTable">
                        <tr>
                            <td colspan="4">No data available</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const API_URL = "{% url 'get_customer_analytics' %}";

function loadAnalytics() {

    fetch(API_URL, {
        headers: {
            "Authorization": `Bearer ${localStorage.getItem("access_token")}`
        }
    })
    .then(res => res.json())
    .then(data => {
        renderTable(data);
        renderCharts(data);
    });
}

function renderTable(data) {

    let html = "";

    data.top_buyers.forEach(c => {
        html += `<tr>
                    <td><span class="badge bg-success">Top</span></td>
                    <td>${c.user__full_name}</td>
                    <td>${c.total_orders}</td>
                    <td>${c.total_spent}</td>
                 </tr>`;
    });

    data.repeat_customers.forEach(c => {
        html += `<tr>
                    <td><span class="badge bg-info">Repeat</span></td>
                    <td>${c.user__full_name}</td>
                    <td>${c.total_orders}</td>
                    <td>${c.total_spent}</td>
                 </tr>`;
    });

    $("#customerTable").html(html);
}

function renderCharts(data) {

    // Top Buyers Chart
    new Chart(document.getElementById("topBuyersChart"), {
        type: 'bar',
        data: {
            labels: data.top_buyers.map(x => wrapLabel(x.user__full_name, 10)),
            datasets: [{
                label: 'Total Spent',
                data: data.top_buyers.map(x => x.total_spent)
            }]
        }
    });

    // Repeat Customers Chart
    new Chart(document.getElementById("repeatChart"), {
        type: 'pie',
        data: {
            labels: data.repeat_customers.map(x => x.user__full_name),
            datasets: [{
                data: data.repeat_customers.map(x => x.total_orders)
            }]
        }
    });
}

function wrapLabel(str, maxWidth = 10) {
    if (!str) return '';
    let words = str.split(' ');
    let lines = [];
    let currentLine = '';

    words.forEach(word => {
        if ((currentLine + word).length > maxWidth) {
            lines.push(currentLine.trim());
            currentLine = word + ' ';
        } else {
            currentLine += word + ' ';
        }
    });

    lines.push(currentLine.trim());
    return lines.slice(0, 3);
}

loadAnalytics();
</script>

{% endblock %}
