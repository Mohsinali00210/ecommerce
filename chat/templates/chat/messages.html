{% extends "base.html" %}

{% block title %}Messages{% endblock %}

{% block content %}
    <style>
        .msg {
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            max-width: 70%;
        }

        .msg.admin {
            background: #0d6efd;
            color: white;
            margin-left: auto;
        }

        .msg.user {
            background: #e9ecef;
        }

        .thread-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .thread-item:hover {
            background: #f1f1f1;
        }

        .thread-item.unread {
            background: #fff8e6;
            font-weight: 600;
        }

        .unread-badge {
            background: #dc3545;
            color: #fff;
            border-radius: 12px;
            padding: 1px 7px;
            font-size: 11px;
            line-height: 1.6;
        }
    </style>

    <div class="card-body p-0">
        <div class="row g-0" style="height: 75vh;">

            <!-- LEFT: THREAD LIST -->
            <div class="col-4 border-end">
                <div class="p-2 fw-bold border-bottom">Conversations</div>
                <div id="threadList" style="overflow-y:auto; height: 100%;"></div>
            </div>

            <!-- RIGHT: CHAT AREA -->
            <div class="col-8 d-flex flex-column">

                <div class="p-2 border-bottom fw-bold" id="chatHeader">
                    Select a conversation
                </div>

                <div id="chatBody" class="flex-grow-1 p-3" style="overflow-y:auto; background:#f8f9fa;"></div>

                <div class="p-2 border-top d-flex">
                    <input type="text" id="chatInput" class="form-control me-2" placeholder="Type message...">
                    <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                </div>

            </div>
        </div>
    </div>

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>

var links = $(".sidebar a");
links.each(function() {
    $(this).removeClass('active');
});
$("#BrandLink").addClass('active');

let CURRENT_THREAD_ID = null;
let chatSocket = null;

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        document.cookie.split(";").forEach(cookie => {
            const c = cookie.trim();
            if (c.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(c.substring(name.length + 1));
            }
        });
    }
    return cookieValue;
}
const CSRF_TOKEN = getCookie("csrftoken");

// Load all chat threads (includes unread_count per thread for the logged-in admin)
function loadThreads() {
    fetch("{% url 'admin_threads' %}")
    .then(res => res.json())
    .then(data => {
        let html = "";

        data.forEach(t => {
            const isUnread = t.unread_count > 0;
            const badge = isUnread
                ? `<span class="unread-badge">${t.unread_count}</span>`
                : "";

            const productLine = t.product_url
                ? `<a href="${t.product_url}" target="_blank" onclick="event.stopPropagation();">${t.product_name}</a>`
                : (t.product_name || "-");

            html += `
                <div class="thread-item ${isUnread ? "unread" : ""}" data-thread-id="${t.id}" onclick="openChat(${t.id})">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><b>User:</b> ${t.user}</div>
                        ${badge}
                    </div>
                    <div><small>Product: ${productLine}</small></div>
                </div>
            `;
        });

        document.getElementById("threadList").innerHTML = html;
    });
}

loadThreads();
// Poll periodically so unread badges update even for threads you're not viewing
setInterval(loadThreads, 15000);

function markThreadRead(threadId) {
    fetch(`/chat/admin/threads/${threadId}/read/`, {
        method: "POST",
        headers: { "X-CSRFToken": CSRF_TOKEN }
    }).then(() => loadThreads());
}

function openChat(threadId) {
    CURRENT_THREAD_ID = threadId;

    const chatBody = document.getElementById("chatBody");
    chatBody.innerHTML = "";
    document.getElementById("chatHeader").innerText = "Thread #" + threadId;

    if (chatSocket) {
        chatSocket.close();
    }

    fetch(`/chat/admin/threads/${threadId}/`)
    .then(res => res.json())
    .then(data => {
        data.messages.forEach(m => {
            appendMessage(m.message, m.sender);
        });

        scrollToBottom();
        connectSocket(threadId);

        // Mark everything up to now as read for this admin, and refresh badges
        markThreadRead(threadId);
    });
}

function connectSocket(threadId) {
    const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";

    chatSocket = new WebSocket(
        protocol + window.location.host + "/ws/chat/" + threadId + "/" + 0 + "/"
    );

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        appendMessage(data.message, data.sender);
        scrollToBottom();

        // If this thread is open while a new message arrives, keep it marked read
        if (CURRENT_THREAD_ID === threadId) {
            markThreadRead(threadId);
        }
    };
}

function scrollToBottom() {
    const chatBody = document.getElementById("chatBody");
    chatBody.scrollTop = chatBody.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();

    if (!msg || !chatSocket) return;

    chatSocket.send(JSON.stringify({
        message: msg,
        sender: "admin"
    }));

    input.value = "";
}

function appendMessage(message, sender) {
    const div = document.createElement("div");
    div.classList.add("msg", sender === "admin" ? "admin" : "user");
    div.textContent = message;

    const chatBody = document.getElementById("chatBody");
    chatBody.appendChild(div);

    chatBody.scrollTop = chatBody.scrollHeight;
}
</script>
{% endblock %}

{% block extra_js %}
{% endblock %}
