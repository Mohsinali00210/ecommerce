<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>{{ title }} · Shan Zee</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f5fa;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f1424}
 .box{max-width:480px;background:#fff;border-radius:18px;padding:36px 30px;text-align:center;box-shadow:0 20px 60px rgba(16,24,40,.1)}
 h1{font-size:21px;margin:0 0 10px} p{color:#6b7290;line-height:1.6;margin:0 0 22px}
 a{display:inline-block;background:#5b4cf0;color:#fff;text-decoration:none;padding:11px 20px;border-radius:10px;font-weight:600}
</style></head>
<body><main class="box" role="main"><h1>{{ title }}</h1><p>{{ text }}</p><a href="{{ order_url }}">View your order</a></main></body></html>
