<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Redirecting to payment · Shan Zee</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f5fa;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f1424}
 .box{max-width:420px;background:#fff;border-radius:18px;padding:32px 28px;text-align:center;box-shadow:0 20px 60px rgba(16,24,40,.1)}
 p{color:#6b7290;line-height:1.6} button{background:#198754;color:#fff;border:0;padding:11px 22px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer}
</style></head>
<body>
<main class="box" role="main">
  <h1 style="font-size:20px;margin:0 0 8px">Taking you to the secure payment page…</h1>
  <p>If nothing happens in a few seconds, press the button.</p>
  <form id="gw" method="post" action="{{ action }}">
    {% for k, v in fields.items %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
    <button type="submit">Continue to payment</button>
  </form>
</main>
<script>document.getElementById("gw").submit();</script>
</body></html>
